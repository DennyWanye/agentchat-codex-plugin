[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentchat-codex-bridge"
version = "0.1.0"
description = "A secure local passive bridge between AgentChat and a Codex task"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/DennyWanye/agentchat-codex-plugin"
Repository = "https://github.com/DennyWanye/agentchat-codex-plugin"
Issues = "https://github.com/DennyWanye/agentchat-codex-plugin/issues"

[project.scripts]
agentchat-bridge = "bridge.cli:main"

[tool.setuptools]
packages = ["bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
