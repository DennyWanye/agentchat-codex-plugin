[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentchat-codex-bridge"
version = "0.2.0"
description = "A bounded local AgentChat bridge for Codex and Claude Code sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/DennyWanye/agentchat-codex-plugin"
Repository = "https://github.com/DennyWanye/agentchat-codex-plugin"
Issues = "https://github.com/DennyWanye/agentchat-codex-plugin/issues"

[project.scripts]
agentchat-bridge = "bridge.cli:main"

[tool.setuptools]
packages = ["bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
