name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q
      - run: python -m compileall -q bridge
      - name: Validate plugin JSON
        run: python -m json.tool .agents/plugins/marketplace.json >/dev/null && python -m json.tool plugins/agentchat-codex/.codex-plugin/plugin.json >/dev/null
